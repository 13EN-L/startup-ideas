[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusgarden-local-backend"
version = "0.1.0"
description = "Windows-local ActivityWatch bridge for the FocusGarden Chrome extension"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "pystray>=0.19,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<6"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
focusgarden-local-backend = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["release*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
