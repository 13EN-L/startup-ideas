appId: com.focusgarden.app
productName: FocusGarden
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!reports/*'
  - '!resources/activitywatch/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,stryker.config.json}'
asarUnpack:
  - resources/**
# The bundled ActivityWatch (npm run fetch:aw) ships next to the app, outside app.asar,
# so its executables can run. The app finds it at process.resourcesPath/activitywatch.
extraResources:
  - from: resources/activitywatch
    to: activitywatch
win:
  executableName: focusgarden
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: focusgarden
  maintainer: FocusGarden team
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
