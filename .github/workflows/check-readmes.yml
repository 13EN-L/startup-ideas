# .github/workflows/check-readmes.yml
name: Check startup readmes
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify files and criteria
        run: |
          for i in 1 2 3 4 5; do
            f=".github/ideas/readme-startup$i.md"
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
            for n in 1 2 3 4 5 6 7 8; do
              grep -qE "^### $n\." "$f" || { echo "$f missing criterion $n"; exit 1; }
            done
          done
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: ".github/ideas/readme-startup*.md"
