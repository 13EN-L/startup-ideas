name: Build Windows local backend

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend build dependencies
        run: python -m pip install -e "backend[build]"

      - name: Build packaged backend
        run: python backend/build_release.py

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FocusGardenLocalBackend-windows-x86_64
          path: backend/FocusGardenLocalBackend-windows-x86_64.zip
