<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FocusGarden settings</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { max-width: 520px; margin: var(--space-6) auto; padding: var(--space-4); font-size: var(--text-sm); }
    form { display: flex; flex-direction: column; gap: var(--space-4); max-width: 480px; }
    label { display: flex; flex-direction: column; gap: var(--space-1); font-weight: var(--weight-medium); }
    .row { display: flex; align-items: center; gap: var(--space-3); }
    #status { margin: 0; }
  </style>
</head>
<body>
  <p><a class="muted" href="./">← Back to FocusGarden</a></p>
  <form id="settings" class="card">
    <h2>Distracting sites</h2>
    <label>
      Always count as off-task
      <textarea class="input" id="distractingSites" rows="4" spellcheck="false"></textarea>
      <span class="muted">One site or app per line, e.g. instagram.com. Subdomains count too. Put a site in a
        session's "Always on-task" list to allow it for that session.</span>
    </label>
    <div class="row">
      <button class="btn" type="submit">Save</button>
      <button class="btn btn-secondary" type="button" id="test">Check activity tracking</button>
    </div>
    <p id="status" class="muted" role="status"></p>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
